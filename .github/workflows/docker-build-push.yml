name: Build agent-base image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

# Cache: build layers live in the container registry
# (<REGISTRY>/agent-base:buildcache), not in a CI-specific cache service, so the
# same build definition and the same cache work on GitHub Actions, Gitea Actions
# and a developer machine. See CACHE_WRITE in docker-bake.hcl. GHA-style
# `type=gha` caching is deliberately not used: it needs the GitHub Actions cache
# service, which self-hosted forges do not provide.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # oci_labels() uses GIT_SHA/GIT_REF; a full history leaves room for
          # `git describe`-style steps later.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Derives the registry and source URL from the hosting context (GitHub
      # Actions or Gitea Actions, which aliases github.*). This workflow is the
      # only place that assumes an identity; docker-bake.hcl defaults to none.
      - name: Set variables
        id: vars
        run: |
          set -euo pipefail

          is_github_hosted=false
          if [ "${GITHUB_SERVER_URL}" = "https://github.com" ]; then is_github_hosted=true; fi

          server_host="${GITHUB_SERVER_URL#http://}"
          server_host="${server_host#https://}"

          if [ "${is_github_hosted}" = true ]; then registry_host="ghcr.io"; else registry_host="${server_host}"; fi

          registry="${registry_host}/${GITHUB_REPOSITORY_OWNER}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # docker login wants the token owner's username. On a self-hosted
          # forge the run may be triggered by someone else, so use the
          # repository owner (the account holding the PAT).
          registry_user="${GITHUB_ACTOR}"
          if [ "${is_github_hosted}" != true ]; then registry_user="${GITHUB_REPOSITORY_OWNER}"; fi

          git_ref="${GITHUB_REF#refs/tags/}"
          git_ref="${git_ref#refs/heads/}"

          {
            echo "is_github_hosted=${is_github_hosted}"
            echo "registry_host=${registry_host}"
            echo "registry=${registry}"
            echo "registry_user=${registry_user}"
            echo "source_url=${source_url}"
            echo "git_sha=${GITHUB_SHA}"
            echo "git_ref=${git_ref}"
          } >> "$GITHUB_OUTPUT"

      # The test target builds the image and its test stage (shellcheck plus
      # the tool-matrix selftest) and exports nothing. It only reads the registry
      # cache; the build-and-push step below writes it, so the two never race for
      # the same cache tag.
      - name: Build and run image tests
        uses: docker/bake-action@v7
        with:
          targets: test
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          GIT_SHA: ${{ steps.vars.outputs.git_sha }}
          GIT_REF: ${{ steps.vars.outputs.git_ref }}
          SOURCE_URL: ${{ steps.vars.outputs.source_url }}

      # Skipped on pull requests: fork PRs can't see secrets and unmerged code
      # shouldn't be published. GHCR needs the built-in GITHUB_TOKEN; a
      # self-hosted registry has none, so GIT_TOKEN is a PAT/deploy token
      # scoped to it.
      # Gitea's auto-injected actions token cannot authenticate against its
      # package registry (no package scope), so a self-hosted forge needs an
      # explicit access token in the repository secret GIT_TOKEN with
      # "write:package". Fail with that instruction rather than docker's generic
      # login error.
      - name: Check registry credentials
        if: github.event_name != 'pull_request' && steps.vars.outputs.is_github_hosted != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -eu
          if [ -z "${GIT_TOKEN}" ]; then
            echo "::error::secrets.GIT_TOKEN is empty. Create a Gitea access token with the 'write:package' scope and add it as a repository secret named GIT_TOKEN."
            exit 1
          fi

      # Skipped on pull requests: fork PRs cannot see secrets and unmerged code
      # should not be published. GHCR needs the built-in GITHUB_TOKEN; a
      # self-hosted registry has none, so GIT_TOKEN is a PAT with package scope.
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.registry_host }}
          username: ${{ steps.vars.outputs.registry_user }}
          password: ${{ steps.vars.outputs.is_github_hosted == 'true' && secrets.GITHUB_TOKEN || secrets.GIT_TOKEN }}

      # The stacks build FROM the base image, so the two bakes run in order: the
      # base first, then the stacks against the tag it just produced.
      - name: Build and push base image
        uses: docker/bake-action@v7
        with:
          targets: agent-base
          push: ${{ github.event_name != 'pull_request' }}
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          SOURCE_URL: ${{ steps.vars.outputs.source_url }}
          GIT_SHA: ${{ steps.vars.outputs.git_sha }}
          GIT_REF: ${{ steps.vars.outputs.git_ref }}
          CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
          CACHE_READ: "true"

      - name: Build and push stacks
        uses: docker/bake-action@v7
        with:
          targets: opencode dsh
          push: ${{ github.event_name != 'pull_request' }}
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          SOURCE_URL: ${{ steps.vars.outputs.source_url }}
          GIT_SHA: ${{ steps.vars.outputs.git_sha }}
          GIT_REF: ${{ steps.vars.outputs.git_ref }}
          # Cache lives in the registry as <REGISTRY>/agent-base:buildcache.
          # Writing needs push rights, so pull requests build read-only instead
          # of publishing a cache produced by unmerged code.
          CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
          CACHE_READ: "true"
