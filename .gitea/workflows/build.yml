# =============================================================================
# Build and push the images. The target list comes from stack manifests; the
# tag contract lives in versions.env and tooling/release.sh.
# =============================================================================
name: Build and push images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Resolve registry and cache policy
        run: |
          set -euo pipefail
          registry_host="${GITHUB_SERVER_URL#*://}"
          registry_host="${registry_host%/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          {
            echo "REGISTRY=${registry_host}/${owner}"
            echo "REGISTRY_HOST=${registry_host}"
            echo "CACHE_READ=true"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "CACHE_WRITE=false"
            else
              echo "CACHE_WRITE=true"
            fi
          } >> "${GITHUB_ENV}"

      - name: Check registry credentials
        if: github.event_name != 'pull_request'
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -eu
          [ -n "${GIT_TOKEN}" ] || {
            printf '%s\n' "::error::GIT_TOKEN is empty; create a Gitea token with write:package and add it as a repository secret." >&2
            exit 1
          }

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: make check
        run: make check

      - name: Build the base test stages
        run: |
          set -euo pipefail
          tooling/bake.sh test
          tooling/bake.sh test-node22

      - name: Build every stack test stage
        run: |
          set -euo pipefail
          for id in $(tooling/stacks.sh --list); do
            tooling/bake.sh "${id}-test"
          done

      - name: Build and push the base images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          tooling/bake.sh --push --provenance=mode=max --sbom=generator \
            agent-base agent-base-node22

      - name: Build and push the stack images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          targets="$(tooling/stacks.sh --list)"
          # shellcheck disable=SC2086
          tooling/bake.sh --push --provenance=mode=max --sbom=generator ${targets}
