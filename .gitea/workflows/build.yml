# =============================================================================
# Build and push the images — Gitea Actions only
# =============================================================================
# Runs on this repository's Gitea instance (git.omesa.net). There is no GitHub
# path: the registry host, namespace and credentials all come from the Gitea
# context, so nothing has to be configured per forge.
#
# What it produces, in order:
#   agent-base:<version> + :latest   the base image every stack builds FROM
#   opencode:<version>  + :latest
#   dsh:<version>       + :latest
#
# Credentials: the built-in job token, `${{ secrets.GITEA_TOKEN }}`, performs the
# registry login. It needs the `packages: write` permission, which the job asks
# for below; Gitea clamps it to whatever maximum the owner or repository allows
# (Settings -> Actions -> General). No personal access token is involved.
# Read-only workflows (pull requests, and forks especially) never log in.
#
# Cache lives in the registry (<REGISTRY>/agent-base:buildcache), which works on
# a self-hosted forge; the GitHub-only `type=gha` cache does not exist here.
# Pull requests build without pushing and without logging in.
# =============================================================================

name: Build and push images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Required for the built-in job token to push to the container registry;
    # Gitea clamps this to the maximum configured for the owner or repository.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # docker-bake.hcl's labels take the commit SHA and ref; a full history
          # keeps tag lookups meaningful.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Everything the bake file cannot know: where the registry is, which
      # repository this is, and which commit is being built.
      - name: Resolve registry and provenance
        id: vars
        run: |
          set -euo pipefail

          # GITHUB_SERVER_URL looks like https://git.omesa.net
          registry_host="${GITHUB_SERVER_URL#*://}"
          registry_host="${registry_host%/}"

          owner="${GITHUB_REPOSITORY%%/*}"
          registry="${registry_host}/${owner}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # refs/heads/main -> main, refs/tags/v1.2.3 -> v1.2.3
          git_ref="${GITHUB_REF#refs/tags/}"
          git_ref="${git_ref#refs/heads/}"

          {
            echo "registry_host=${registry_host}"
            echo "registry=${registry}"
            echo "source_url=${source_url}"
            echo "git_sha=${GITHUB_SHA}"
            echo "git_ref=${git_ref}"
          } >> "${GITHUB_OUTPUT}"

      # The job token is injected by Gitea; an empty value means Actions was
      # started without one (older Gitea, or a runner that does not provide it).
      - name: Check the job token is available
        if: github.event_name != 'pull_request'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          if [ -z "${GITEA_TOKEN}" ]; then
            printf '%s\n' \
              "::error::secrets.GITEA_TOKEN is empty. This workflow relies on the built-in Actions job token;" \
              "check that MFA/runner settings provide it, or fall back to a token secret."
            exit 1
          fi

      # The job token acts as the user who triggered the run.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.registry_host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      # The build-time checks: shellcheck on every script and the tool matrix,
      # in the image's "test" stage. Exports nothing.
      - name: Build the test stage
        uses: docker/bake-action@v7
        with:
          targets: test
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          SOURCE_URL: ${{ steps.vars.outputs.source_url }}
          GIT_SHA: ${{ steps.vars.outputs.git_sha }}
          GIT_REF: ${{ steps.vars.outputs.git_ref }}

      # The stacks build FROM the base image, so the two bakes run in order: the
      # base first, then the stacks against the tag it just produced.
      - name: Build and push the base image
        uses: docker/bake-action@v7
        with:
          targets: agent-base
          push: ${{ github.event_name != 'pull_request' }}
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          SOURCE_URL: ${{ steps.vars.outputs.source_url }}
          GIT_SHA: ${{ steps.vars.outputs.git_sha }}
          GIT_REF: ${{ steps.vars.outputs.git_ref }}
          # Registry cache: read on every run, written only where push rights
          # exist. A failed read is a cache miss, not a build failure.
          CACHE_READ: "true"
          CACHE_WRITE: ${{ github.event_name != 'pull_request' }}

      - name: Build and push the stacks
        uses: docker/bake-action@v7
        with:
          targets: opencode dsh
          push: ${{ github.event_name != 'pull_request' }}
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          SOURCE_URL: ${{ steps.vars.outputs.source_url }}
          GIT_SHA: ${{ steps.vars.outputs.git_sha }}
          GIT_REF: ${{ steps.vars.outputs.git_ref }}
          CACHE_READ: "true"
          CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
