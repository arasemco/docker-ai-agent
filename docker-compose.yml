# =============================================================================
# opencode — the OpenCode Web UI on agent-base
# =============================================================================
# The sandbox (service skeleton, devices and seccomp for the inner daemon,
# optional proxy, limits, mounts and skills) is assembled from agent-base's
# compose fragments by scripts/compose.sh. This file carries only what is
# OpenCode-specific: the build, the published port, credentials and state
# volumes. It has no devices, no proxy values, no host paths and no limits.
#
#   cp .env.example .env
#   ./scripts/compose.sh -- up -d --build          # base + daemon
#   make up WITH=daemon,proxy                      # + outbound proxy
#
#   http://127.0.0.1:4096
# =============================================================================

services:
  opencode:
    image: ${OPENCODE_IMAGE:-opencode:local}
    pull_policy: build
    build:
      context: ./image
      dockerfile: Dockerfile
      args:
        AGENT_BASE: ${AGENT_BASE:-agent-base:1.4.0}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.19.5}
    hostname: opencode
    # Arguments for AGENT_CMD. --hostname 0.0.0.0 is what makes the published
    # port reachable; exposure is controlled by the binding below.
    command: ["web", "--port", "${OPENCODE_PORT:-4096}", "--hostname", "0.0.0.0"]
    ports:
      # Loopback by default, because the password has a weak fallback. Set
      # OPENCODE_BIND_IP=0.0.0.0 to publish on the LAN.
      - "${OPENCODE_BIND_IP:-127.0.0.1}:${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    environment:
      # HTTP basic auth for the Web UI.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-changeme123}
      # Provider credentials, passed through empty: set the ones in use, the
      # rest stay unset and their providers are simply not offered.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    volumes:
      # OpenCode state. Named volumes by default, so the directories are created
      # with the agent user's ownership; point a *_HOST variable at an existing
      # host path (owned by uid 1000) to bind instead.
      #   config -> providers and models (see examples/config/)
      #   data   -> auth.json, session database, snapshots
      #   state  -> XDG state
      - ${OPENCODE_CONFIG_HOST:-opencode-config}:/home/agent/.config/opencode
      - ${OPENCODE_DATA_HOST:-opencode-data}:/home/agent/.local/share/opencode
      - ${OPENCODE_STATE_HOST:-opencode-state}:/home/agent/.local/state/opencode

volumes:
  # agent-docker is required by agent-base's daemon fragment.
  agent-docker:
  opencode-config:
  opencode-data:
  opencode-state:
