services:
  opencode:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCODE_UID: ${OPENCODE_UID:-1000}
        OPENCODE_GID: ${OPENCODE_GID:-1000}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-}
        DOCKER_VERSION: ${DOCKER_VERSION:-29.8.1}
    image: opencode:local
    hostname: opencode
    init: true
    stdin_open: true
    tty: true
    restart: no
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    runtime: runc
    environment:
      # Protect your Web UI with a password
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-changeme123}
      # Plug in any provider key you want
      - MAMMOUTH_API_KEY=${MAMMOUTH_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Local Ollama server (see opencode.jsonc)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.1.48:11434/v1}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama}
      # Route all outbound traffic through the Squid proxy
      - HTTP_PROXY=${HTTP_PROXY:-http://192.168.1.48:3128}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://192.168.1.48:3128}
      - ALL_PROXY=${ALL_PROXY:-http://192.168.1.48:3128}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,192.168.1.48}
      - http_proxy=${http_proxy:-http://192.168.1.48:3128}
      - https_proxy=${https_proxy:-http://192.168.1.48:3128}
      - all_proxy=${all_proxy:-http://192.168.1.48:3128}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1,192.168.1.48}
    volumes:
      # Persistent OpenCode state. These default to Docker-managed volumes so
      # the directories are created with the right owner; point the *_HOST
      # variables at an existing host path (owned by OPENCODE_UID) to bind.
      # data holds auth.json, the session DB and snapshots.
      - ${OPENCODE_CONFIG_HOST:-opencode-config}:/home/opencode/.config/opencode
      - ${OPENCODE_DATA_HOST:-opencode-data}:/home/opencode/.local/share/opencode
      - ${OPENCODE_STATE_HOST:-opencode-state}:/home/opencode/.local/state/opencode
      - ${HOME}/stacks/000-templates:/home/opencode/stacks/000-templates
      - ${HOME}/Projects:/home/opencode/Projects
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 32G

volumes:
  opencode-config:
  opencode-data:
  opencode-state:
