# =============================================================================
# opencode stack — the OpenCode Web UI on agent-base
# =============================================================================
# The sandbox (s6 services, rootless Docker, seccomp/devices, proxy
# pass-through) comes from agent-base/compose/base.yml via `extends`. This file
# adds only what is OpenCode-specific: the build, the published port, the
# credentials and OpenCode's own state volumes.
#
# Nothing here is host-specific — no proxy values, no host paths, no CPU or
# memory numbers. Put those in a gitignored compose/local.yml started from
# examples/, or in .env:
#
#   cp .env.example .env                    # ports, image, password
#   cp examples/compose/host-mounts.yml compose/local.yml   # optional
#   docker compose up -d --build
#
#   http://127.0.0.1:4096
# =============================================================================

services:
  opencode:
    extends:
      file: ../agent-base/compose/base.yml
      service: agent-base
    image: ${OPENCODE_IMAGE:-opencode:local}
    pull_policy: build
    build:
      context: ./image
      dockerfile: Dockerfile
      args:
        # Pin the shared base by tag (never :latest) so a rebuild is
        # reproducible; override AGENT_BASE to use a pushed image.
        AGENT_BASE: ${AGENT_BASE:-agent-base:1.1.0}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.19.5}
    hostname: opencode
    command: ["web", "--port", "${OPENCODE_PORT:-4096}", "--hostname", "0.0.0.0"]
    ports:
      # Loopback by default, because the password has a weak fallback (see
      # .env.example). Set OPENCODE_BIND_IP=0.0.0.0 to publish on the LAN.
      - "${OPENCODE_BIND_IP:-127.0.0.1}:${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    environment:
      # HTTP basic auth for the Web UI.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-changeme123}
      # Provider credentials, passed through empty: set the ones you use in
      # .env (or a local override) and the rest simply stay unset.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    volumes:
      # OpenCode state. Named volumes by default so the directories are created
      # with the agent user's ownership; point the *_HOST variables at an
      # existing host path (owned by uid 1000) to bind instead.
      #   config -> providers/models (see examples/config/)
      #   data   -> auth.json, session DB, snapshots
      #   state  -> XDG state
      - ${OPENCODE_CONFIG_HOST:-opencode-config}:/home/agent/.config/opencode
      - ${OPENCODE_DATA_HOST:-opencode-data}:/home/agent/.local/share/opencode
      - ${OPENCODE_STATE_HOST:-opencode-state}:/home/agent/.local/state/opencode

volumes:
  # Required by agent-base/compose/base.yml (extends cannot carry top-level
  # volume declarations across files). Compose prefixes each with the project
  # name, so these cannot collide with another stack's volumes.
  agent-docker:
  opencode-config:
  opencode-data:
  opencode-state:
