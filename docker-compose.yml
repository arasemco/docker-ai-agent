# =============================================================================
# agent-base test harness — builds and runs the base image on its own
# =============================================================================
# This is the base image's own smoke-test stack, not a deployable agent: it
# uses compose.base.yml (the shared definition children extend) with nothing
# added but the build itself, and keeps the container alive so
# `scripts/smoke.sh` / `make smoke` can exec the selftest inside it.
#
#   cp .env.example .env && docker compose up -d --build
#   docker compose exec agent-base /usr/local/lib/agent-base/selftest.sh
#   docker compose down --volumes
# =============================================================================

services:
  agent-base:
    extends:
      file: compose.base.yml
      service: agent-base
    image: ${AGENT_IMAGE:-agent-base:local}
    pull_policy: build
    # The harness keeps the working directory in a named volume instead of a
    # host path, so `make smoke` works on any host. On a host whose outer
    # Docker daemon is rootless, host bind mounts appear root-owned inside the
    # container and are not writable by AGENT_UID (see README, "Hosts with a
    # rootless outer daemon"); a volume side-steps that entirely.
    volumes:
      - agent-projects:/home/${AGENT_USER:-agent}/Projects
    build:
      context: .
      dockerfile: Dockerfile
      # Never the last stage: "test" comes after it and needs no daemon.
      target: agent-base
      args:
        AGENT_USER: ${AGENT_USER:-agent}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
        DOCKER_VERSION: ${DOCKER_VERSION:-29.8.1}
        YQ_VERSION: ${YQ_VERSION:-4.54.1}
        UV_VERSION: ${UV_VERSION:-0.13.6}
    # Entrypoint exec's AGENT_CMD (bash here) with these args; `bash -lc
    # "sleep infinity"` keeps the container up for `exec`.
    command: ["-lc", "sleep infinity"]

volumes:
  # Declared by the consuming project, not by compose.base.yml (extends does
  # not carry top-level declarations across files). Also depends on the
  # compose project name, so it is "agent-base_agent-docker" here unless
  # AGENT_DOCKER_VOLUME overrides it.
  agent-docker:
  # Second mount on the same target as compose.base.yml's Projects mount:
  # compose merges volumes by target, so this one wins.
  agent-projects:
