# =============================================================================
# agent-base — minimal working stack
# =============================================================================
# `docker compose up -d --build` builds the image and starts it with the s6
# services and an inner Docker daemon. The included fragments are the same ones
# scripts/compose.sh can combine differently; nothing is duplicated:
#
#   compose/base.yml    service skeleton + AGENT_* toggles
#   compose/daemon.yml  devices/seccomp + the daemon's data volume
#   compose/image.yml   build image/ (the default command is set below)
#
# Want proxy, limits or a host-mounted workspace? Add the matching fragment
# instead of editing this file:
#
#   make up WITH=daemon,proxy,limits,mounts
#   # or: scripts/compose.sh --with daemon,proxy,limits,mounts \
#   #       --file compose/image.yml -- up -d --build
#
#   docker compose exec --user 1000 agent-base bash
# =============================================================================

name: agent-base

include:
  - compose/base.yml
  - compose/daemon.yml
  - compose/image.yml

services:
  agent-base:
    # This image ships no agent CLI, so its default command is a shell — which
    # exits at once without a TTY. The default stack is therefore a sandbox
    # that stays up for `docker compose exec`; a child image replaces this with
    # its own command.
    command: ["-lc", "sleep infinity"]

# No volumes block here: each fragment declares the volume it mounts
# (daemon.yml -> agent-docker, image.yml -> agent-workspace), so include and -f
# both work without the composing file knowing about them.
