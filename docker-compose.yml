# Index only. Each module owns its service fragment; compose include loads them
# into one project. Image references are exported by tooling/versions.sh, and
# the host overlay is passed separately with -f.
name: agent

include:
  - path: base/compose.yml
  - path: stacks/opencode/compose.yml
  - path: stacks/dsh/compose.yml
  - path: stacks/claude/compose.yml
