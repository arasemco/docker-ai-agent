# =============================================================================
# opencode stack — only the OpenCode-specific bits
# =============================================================================
# The sandbox (s6 services, rootless Docker devices/seccomp, proxy, limits,
# mounts) is assembled from agent-base's compose fragments by scripts/compose.sh:
#
#   cp .env.example .env
#   ./scripts/compose.sh -- up -d --build          # base + daemon (default)
#   ./scripts/compose.sh --with daemon,proxy -- up -d
#   make up WITH=daemon,proxy,limits
#
# This file therefore carries no devices, no seccomp, no proxy values, no host
# paths and no CPU/memory numbers.
#
#   http://127.0.0.1:4096
# =============================================================================

services:
  opencode:
    image: ${OPENCODE_IMAGE:-opencode:local}
    pull_policy: build
    build:
      context: ./image
      dockerfile: Dockerfile
      args:
        # Pin the shared base by tag (never :latest) so a rebuild is
        # reproducible; override AGENT_BASE to use a pushed agent-base.
        AGENT_BASE: ${AGENT_BASE:-agent-base:1.2.0}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.19.5}
    hostname: opencode
    command: ["web", "--port", "${OPENCODE_PORT:-4096}", "--hostname", "0.0.0.0"]
    ports:
      # Loopback by default, because the password has a weak fallback (see
      # .env.example). Set OPENCODE_BIND_IP=0.0.0.0 to publish on the LAN.
      - "${OPENCODE_BIND_IP:-127.0.0.1}:${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    environment:
      # HTTP basic auth for the Web UI.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-changeme123}
      # Provider credentials, passed through empty: set the ones you use in
      # .env (or a local override) and the rest simply stay unset.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    volumes:
      # OpenCode state. Named volumes by default so the directories are created
      # with the agent user's ownership; point the *_HOST variables at an
      # existing host path (owned by uid 1000) to bind instead.
      #   config -> providers/models (see examples/config/)
      #   data   -> auth.json, session DB, snapshots
      #   state  -> XDG state
      - ${OPENCODE_CONFIG_HOST:-opencode-config}:/home/agent/.config/opencode
      - ${OPENCODE_DATA_HOST:-opencode-data}:/home/agent/.local/share/opencode
      - ${OPENCODE_STATE_HOST:-opencode-state}:/home/agent/.local/state/opencode

volumes:
  # Required by agent-base/compose/base.yml.
  agent-docker:
  opencode-config:
  opencode-data:
  opencode-state:
