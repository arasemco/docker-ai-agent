# Shared sandbox and environment for every stack. docker-compose.yml extends
# this file's `common` service through `extends.file`; the service is not part
# of the project and is never started.
#
# The common service lives in its own file because a same-file parent would
# also pass on its `profiles` (and any build target): every stack would inherit
# the base profile and `--profile base` would select them all. A profile-less,
# image-less service cannot leak either.
#
# Proxy variables are resolved here, first match wins per variable:
#
#     HTTP_PROXY  -> http_proxy  -> PROXY  -> (empty)
#     HTTPS_PROXY -> https_proxy -> PROXY  -> (empty)
#     ALL_PROXY   -> all_proxy   -> PROXY  -> (empty)
#     http_proxy  -> HTTP_PROXY  -> PROXY  -> (empty)   (and so on)
#
# Either case fills the other because tools disagree about which one they read,
# and one PROXY value covers every scheme. NO_PROXY is not a proxy address: it
# has no PROXY fallback, only the loopback default, so local endpoints never go
# to the proxy.
services:
  common:
    hostname: ${AGENT_HOSTNAME:-agent}
    init: false
    stdin_open: true
    tty: true
    restart: "no"

    # Every stack is built locally; a stack service may override this.
    pull_policy: build
    build:
      dockerfile: Dockerfile
      args:
        AGENT_USER: ${AGENT_USER:-agent}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
        DOCKER_VERSION: ${DOCKER_VERSION:-29.8.1}
        UV_VERSION: ${UV_VERSION:-0.13.6}

    # What the rootless Docker daemon needs from the host: rootlesskit creates
    # user and mount namespaces (blocked by the default seccomp profile and
    # masked /proc paths), fuse-overlayfs needs /dev/fuse, slirp4netns needs
    # /dev/net/tun.
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined

    devices:
      - /dev/fuse
      - /dev/net/tun

    deploy:
      resources:
        limits:
          cpus: "${AGENT_CPUS:-2}"
          memory: "${AGENT_MEMORY:-4G}"

    environment:
      AGENT_WORKSPACE: /home/agent/workspace
      AGENT_DOCKERD: "${AGENT_DOCKERD:-1}"
      AGENT_DOCKERD_TIMEOUT: "${AGENT_DOCKERD_TIMEOUT:-30}"
      AGENT_DOCKERD_MAX_RESTARTS: "${AGENT_DOCKERD_MAX_RESTARTS:-3}"
      AGENT_RESTART_MAX: "${AGENT_RESTART_MAX:-3}"
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-${PROXY:-}}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-${PROXY:-}}}"
      ALL_PROXY: "${ALL_PROXY:-${all_proxy:-${PROXY:-}}}"
      NO_PROXY: "${NO_PROXY:-${no_proxy:-localhost,127.0.0.1,::1}}"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-${PROXY:-}}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-${PROXY:-}}}"
      all_proxy: "${all_proxy:-${ALL_PROXY:-${PROXY:-}}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-localhost,127.0.0.1,::1}}"

    # A named volume, not a bind mount: the daemon's data holds files owned by
    # subordinate uids, and losing it would throw away the image cache on every
    # recreate. The extending project declares the volume; extends copies
    # service config only.
    volumes:
      - ${AGENT_DOCKER_VOLUME:-agent-docker}:/home/agent/.local/share/docker
