# =============================================================================
# Example: bind-mounting host directories into the container
# =============================================================================
# By default the container's workspace is just a directory inside the image
# (ephemeral). Merge this file to work on real host trees:
#
#   docker compose -f docker-compose.yml -f compose/local.yml up -d
#
# Rules that bite:
#   * The host directory must exist and be writable by uid 1000. A missing bind
#     source is auto-created root-owned, and the container's cont-init then
#     refuses to start with an ownership error.
#   * On a host whose own Docker daemon is rootless, bind mounts appear
#     root-owned INSIDE the container, so uid 1000 cannot write them; use a
#     named volume there instead.
# =============================================================================

services:
  opencode:
    volumes:
      - ${AGENT_PROJECTS_HOST:-${HOME}/Projects}:/home/agent/Projects
      # Read-only host tree plus one writable exception, if you use this
      # layout. Delete what you don't need.
      - ${HOME}/stacks:/home/agent/stacks:ro
      - ${HOME}/stacks/000-templates:/home/agent/stacks/000-templates:rw
