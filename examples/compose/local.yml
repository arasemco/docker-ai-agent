# =============================================================================
# Example: a machine-specific docker-compose.local.yml
# =============================================================================
# Copy to docker-compose.local.yml at the repository root (gitignored) and pass
# it explicitly, after the tracked compose file:
#
#   make up PROFILE=opencode LOCAL_COMPOSE=docker-compose.local.yml
#   docker compose --profile opencode \
#       -f docker-compose.yml -f docker-compose.local.yml up -d
#
# It is the place for a deployment's own binds, devices and limits: source
# trees, read-only shares, the agent tree, a directory that replaces a shared
# mount. The service keys match the stack services.
#
# The agent tree is read-only at the top; each stack's writable subpaths are
# added separately in the real overlay (the dsh stack, for example, adds its
# hooks, instructions, memory, plans, state and workspace).
# =============================================================================

x-local-volumes: &local-volumes
  - ${HOME}/.agents:/home/agent/.agents:ro
  - ${HOME}/Projects:/home/agent/Projects:rw
  - ${HOME}/stacks:/home/agent/stacks:ro

services:
  agent-base:
    volumes: *local-volumes

  opencode:
    volumes: *local-volumes

  dsh:
    volumes: *local-volumes

  claude:
    volumes: *local-volumes
