# =============================================================================
# Example: a machine-specific compose/local.yml
# =============================================================================
# Copy to compose/local.yml (gitignored) and pass it explicitly with -f. It is the place for a deployment's own
# binds: source trees, read-only shares, a directory that replaces a anchor's
# volume.
#
# The service key must match the stack being extended:
#   agent-base           this repository's own stack
#   <service>            a child stack (see its docker-compose.yml)
#
# Examples below bind a host source tree read-write and a shared directory
# read-only, which is a common layout:
#
#   cp examples/compose/local.yml compose/local.yml
# =============================================================================

services:
  agent-base:
    volumes:
      - ${HOME}/Projects:/home/agent/Projects:rw
      - ${HOME}/stacks:/home/agent/stacks:ro
      - ${HOME}/stacks/000-templates:/home/agent/stacks/000-templates:rw
