# =============================================================================
# Example: CPU/memory limits for one agent container
# =============================================================================
# compose/base.yml sets none — a shared base has no business picking numbers
# for your machine. Merge this file when you want them:
#
#   docker compose -f compose/harness.yml -f examples/compose/limits.yml up -d
#
# The service key must match the one in the compose file you are extending
# (`agent-base` for the harness; rename it for your own stack).
# =============================================================================

services:
  agent-base:
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 32G
