# =============================================================================
# Example: a child stack on agent-base's compose fragments
# =============================================================================
# This file carries ONLY what is specific to the example agent. The sandbox —
# s6 services, rootless Docker devices/seccomp, optional proxy/limits/mounts —
# is assembled by agent-base's scripts/compose.sh, which also renames the
# fragments' canonical service (`agent-base`) to the service name below.
#
#   cp -r examples/child-image /tmp/my-agent && cd /tmp/my-agent
#   /path/to/agent-base/scripts/compose.sh \
#       --service example-cli \
#       --fragments /path/to/agent-base/compose \
#       --file docker-compose.yml -- up -d --build
#
# A real child repo wraps that command in its own scripts/compose.sh (see the
# sibling opencode repo) so callers just run `make up`.
# =============================================================================

services:
  example-cli:
    image: ${EXAMPLE_IMAGE:-example-cli:local}
    pull_policy: build
    build:
      # Relative to the project directory (the dir you run compose.sh from).
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_BASE: ${AGENT_BASE:-agent-base:1.1.0}
        CLI_VERSION: ${CLI_VERSION:-1.0.0}
    hostname: example-cli
    # Args for AGENT_CMD (the image sets it to example-cli).
    command: ["--help"]
    volumes:
      # The CLI's own state. Named volume by default so its ownership matches
      # the image's agent user; point the variable at a host path to bind.
      - ${EXAMPLE_HOME_HOST:-example-cli-home}:/home/agent/.config/example-cli

volumes:
  # Required by compose/base.yml.
  agent-docker:
  example-cli-home:
