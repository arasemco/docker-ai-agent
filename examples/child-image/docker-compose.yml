# =============================================================================
# Example: a child stack on the base image
# =============================================================================
# This file carries ONLY what is specific to the example agent. The sandbox —
# s6 services, rootless Docker devices/seccomp, proxy values and limits — is
# inherited from the common service in the repository's compose.common.yml;
# copy that service into your own file to stand alone.
#
#   cp -r examples/child-image /tmp/my-agent && cd /tmp/my-agent
#   docker compose -f container/docker-compose.yml up -d --build
#
# Inside this repository the stacks under stacks/ work the same way.
# =============================================================================

services:
  example-cli:
    image: ${EXAMPLE_IMAGE:-example-cli:local}
    pull_policy: build
    build:
      # Relative to the directory this file lives in.
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_BASE: ${AGENT_BASE:-agent-base:1.5.0}
        CLI_VERSION: ${CLI_VERSION:-1.0.0}
    hostname: example-cli
    # No command: the image's s6 agent service defines what the CLI runs (see
    # the Dockerfile). A `command:` here would be run by s6 as a separate
    # foreground command, not passed to the CLI.
    volumes:
      # The CLI's own state. Named volume by default so its ownership matches
      # the image's agent user; point the variable at a host path to bind.
      - ${EXAMPLE_HOME_HOST:-example-cli-home}:/home/agent/.config/example-cli

volumes:
  # Required by the common service.
  agent-docker:
  example-cli-home:
