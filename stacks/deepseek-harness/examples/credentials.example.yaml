# Shape of $DSH_HOME/.credentials.yaml, as dsh writes it (Settings -> Models).
#
# Do not commit a real key. This file exists so the layout is recognisable when
# debugging the healthcheck, which needs the browser-session record below.
#
# version: 1
# refs:
#   DEEPSEEK_API_KEY: sk-...
# records:
#   client-connection/browser-session:
#     payload:
#       secret: <base64url secret dsh generates on first sign-in>
