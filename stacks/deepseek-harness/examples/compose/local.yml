# =============================================================================
# Example: a machine-specific compose/local.yml
# =============================================================================
# Copy to compose/local.yml (gitignored). scripts/compose.sh appends it to every
# invocation, so it needs no flag. Use it for what is true only on one machine:
# extra source trees, a read-only share, a bind that replaces the home volume.
#
# The service key must match this stack's service ("dsh").
#
#   cp examples/compose/local.yml compose/local.yml
# =============================================================================

services:
  dsh:
    volumes:
      # A host tree the agent may edit, under the workspace.
      - ${HOME}/src:/home/agent/workspace/src
      # A read-only reference tree.
      - ${HOME}/reference:/home/agent/reference:ro
