# =============================================================================
# dsh — the DeepSeek Harness Web UI on agent-base
# =============================================================================
# The sandbox (service skeleton, devices and seccomp for the inner daemon,
# optional proxy, limits, mounts and skills) is assembled from agent-base's
# compose fragments by scripts/compose.sh. This file carries only what is
# dsh-specific: the build, host networking, credentials and the DSH_* variables.
#
# WHY network_mode: host
#   dsh's web server binds 127.0.0.1 and refuses wildcard addresses, because it
#   exposes remote code execution to whoever can reach it. A container's loopback
#   is its own, so a published port forwards to an address nothing listens on.
#   With host networking the container's 127.0.0.1 is the host's 127.0.0.1, and
#   the UI answers at http://localhost:3080 exactly as if dsh ran on the host —
#   still loopback-only, not exposed to the LAN. Host networking is not available
#   on Docker Desktop for macOS/Windows; run dsh on the host there instead.
#
#   cp .env.example .env
#   make up                    # build + start (base + daemon fragments)
# =============================================================================

name: dsh

services:
  dsh:
    image: ${DSH_IMAGE:-dsh:local}
    pull_policy: build
    build:
      context: ./image
      dockerfile: Dockerfile
      # Build the runtime stage: "test" needs a BuildKit secret and is only
      # produced by the bake "test" target.
      target: runtime
      args:
        AGENT_BASE: ${AGENT_BASE:-agent-base:1.4.1}
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.5}
    network_mode: host
    command: ["web"]
    environment:
      - DSH_PORT=${DSH_PORT:-3080}
      - DSH_WORKSPACE=/home/agent/workspace
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      - DSH_DOCKERD=${DSH_DOCKERD:-1}
    volumes:
      # Profiles, credentials (the DeepSeek API key written by Settings -> Models)
      # and session history. A named volume inherits the agent user's ownership
      # from the image; point DSH_HOME_HOST at a host directory (owned by uid
      # 1000) to bind instead.
      - ${DSH_HOME_HOST:-dsh-home}:/home/agent/.dsh

volumes:
  # agent-docker is required by agent-base's daemon fragment.
  agent-docker:
  dsh-home:
