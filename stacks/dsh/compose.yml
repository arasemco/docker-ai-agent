# dsh binds 127.0.0.1 and refuses wildcard addresses, because it exposes remote
# code execution to the network. A container's loopback is its own, so a
# published port would forward to an address where nothing listens; with host
# networking the container's 127.0.0.1 is the host's, and the UI answers at
# http://localhost:3080 with the loopback-only exposure dsh intends.
services:
  dsh:
    profiles: ["dsh"]
    extends: {file: ../../compose/common.yml, service: common}
    image: ${DSH_IMAGE:?run through make or tooling/versions.sh --export}
    network_mode: host
    environment:
      DSH_PORT: "${DSH_PORT:-3080}"
      DSH_WORKSPACE: /home/agent/workspace
      DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:-}"
    volumes:
      # Profiles, credentials (the API key written by Settings -> Models) and
      # session history.
      - ${DSH_HOME_HOST:-dsh-home}:/home/agent/.dsh
      - ${DSH_WORKSPACE_HOST:-dsh-workspace}:/home/agent/workspace

volumes:
  dsh-home:
  dsh-workspace:
