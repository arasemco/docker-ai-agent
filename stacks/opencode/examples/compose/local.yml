# =============================================================================
# Example: a machine-specific compose/local.yml
# =============================================================================
# Copy to compose/local.yml (gitignored) and pass it with -f next to
# docker-compose.yml. It is the place for what is true only on one
# machine: extra source trees, a read-only share, a bind that replaces an
# anchor's volume, a provider endpoint.
#
# The service key must match this stack's service ("opencode").
#
#   cp examples/compose/local.yml compose/local.yml
# =============================================================================

services:
  opencode:
    volumes:
      # A host tree the agent may edit, mounted under the workspace.
      - ${HOME}/src:/home/agent/workspace/src
      # A read-only reference tree.
      - ${HOME}/reference:/home/agent/reference:ro
    environment:
      # Values that only apply here; .env is usually the better place for these.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
