# =============================================================================
# compose/mounts.yml — bind the agent's workspace to a host directory
# =============================================================================
# One fragment, one concern: a host directory for the agent to work in. Without
# it the workspace is just a directory inside the container (ephemeral).
#
#   AGENT_WORKSPACE_HOST=~/src/acme scripts/compose.sh --with daemon,mounts -- up -d
#
# The default is ./workspace under the directory you run compose from — a plain,
# generic location, not anybody's home layout. Set AGENT_WORKSPACE_HOST to
# whatever you actually work in. Add further binds (read-only trees, shared
# templates) in your own compose/local.yml.
#
# Two host-path rules that bite:
#   * The directory must exist and be writable by uid 1000. A missing bind
#     source is auto-created root-owned, and the image's cont-init then refuses
#     to start with an ownership error.
#   * On a host whose own Docker daemon is rootless, bind mounts appear
#     root-owned INSIDE the container, so uid 1000 cannot write them; use a
#     named volume there instead.
# =============================================================================

services:
  agent-base:
    volumes:
      # ${PWD} is the shell/user directory compose was invoked from, so the
      # default lands next to the stack no matter where the fragments live.
      - ${AGENT_WORKSPACE_HOST:-${PWD}/workspace}:/home/${AGENT_USER:-agent}/workspace
