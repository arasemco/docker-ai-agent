# =============================================================================
# compose/image.yml — build this repository's image
# =============================================================================
# One fragment, one concern: the image name, build context, target and build
# args. The command, the service skeleton, devices, proxy, limits and mounts
# belong to the other fragments, so this one is identical in every combination.
#
#   docker compose --profile opencode up -d --build   # a stack on top of it
#   docker compose --profile opencode up -d       # a stack on top of it
# =============================================================================

# The stack file is the first --file, so its directory decides compose's
# project directory (compose/, here) and thus the default project name. Pin it
# so script mode and the root docker-compose.yml agree on names.
name: agent-base

services:
  agent-base:
    image: ${AGENT_IMAGE:-agent-base:local}
    pull_policy: build
    build:
      # Relative to this file's directory (compose/): compose resolves paths in
      # an included fragment against that fragment, not against the repository
      # root.
      context: ../image
      dockerfile: Dockerfile
      target: agent-base
      args:
        AGENT_USER: ${AGENT_USER:-agent}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
        DOCKER_VERSION: ${DOCKER_VERSION:-29.8.1}
        UV_VERSION: ${UV_VERSION:-0.13.6}
    # No command and no mounts here: what the container runs and where its
    # workspace lives are decisions for the composing stack (the root
    # docker-compose.yml, or the stack that extends this service). With no
    # command the image's own default applies — a shell as AGENT_USER.
