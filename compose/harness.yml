# =============================================================================
# compose/harness.yml — this repository's own test stack
# =============================================================================
# Builds image/ and keeps a container alive so scripts/smoke.sh (or `make
# debug`) can poke at it. It is the last overlay: the sandbox itself comes from
# the fragments scripts/compose.sh assembles.
#
#   scripts/compose.sh --file compose/harness.yml -- up -d --build
#   make up            # same, with --with "$(WITH)" (default: daemon)
#
# Not meant to be deployed, and it sets no values you would deploy with.
# =============================================================================

name: agent-base

services:
  agent-base:
    image: ${AGENT_IMAGE:-agent-base:local}
    pull_policy: build
    build:
      # Relative to the project directory (see scripts/compose.sh), not to
      # this file's location.
      context: image
      dockerfile: Dockerfile
      target: agent-base
      args:
        AGENT_USER: ${AGENT_USER:-agent}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
        DOCKER_VERSION: ${DOCKER_VERSION:-29.8.1}
        UV_VERSION: ${UV_VERSION:-0.13.6}
    # The entrypoint hands CMD to the agent service, which runs
    # `bash -lc "sleep infinity"` — enough to keep the container up for exec.
    command: ["-lc", "sleep infinity"]
    volumes:
      # Volume-backed workspace: the harness must work on any host, including
      # ones whose Docker is rootless (where host bind mounts appear
      # root-owned inside the container).
      - agent-projects:/home/${AGENT_USER:-agent}/Projects

volumes:
  # Required by compose/base.yml.
  agent-docker:
  agent-projects:
