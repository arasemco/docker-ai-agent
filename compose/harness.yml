# =============================================================================
# compose/harness.yml — keeps the sandbox container alive for inspection
# =============================================================================
# The base image has no CLI of its own, so "run it" means "an agent service
# running a shell", which exits immediately when there is no TTY. This overlay
# replaces that with a no-op that stays up, so `make exec`, `make debug` and
# scripts/smoke.sh have something to talk to.
#
# Test-only: the root docker-compose.yml sets the same command explicitly, and
# a child image supplies its own (AGENT_CMD plus a compose command:).
# =============================================================================

services:
  agent-base:
    command: ["-lc", "sleep infinity"]
