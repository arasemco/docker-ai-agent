# =============================================================================
# compose/base.yml — the minimum every agent container needs
# =============================================================================
# This is a FRAGMENT, not a stack. It defines the service skeleton that other
# fragments overlay, all keyed to the same canonical service name so compose's
# `-f` merging lines them up:
#
#   base.yml     service skeleton, AGENT_* toggles, daemon data volume
#   daemon.yml   devices + seccomp exceptions the rootless daemon needs
#   proxy.yml    outbound proxy pass-through (empty unless you set it)
#   limits.yml   CPU/memory limits (values from AGENT_CPUS / AGENT_MEMORY)
#   mounts.yml   bind the agent's workspace to a host directory
#
# scripts/compose.sh assembles the ones you ask for and runs compose:
#
#   scripts/compose.sh --with daemon,proxy -- up -d --build
#
# A child stack (a repo with its own Dockerfile) reuses the same fragments:
# scripts/compose.sh renames the canonical service key to the child's service
# name, because `-f` merging only works between files that name the same
# service. See ../examples/child-image.
# =============================================================================

services:
  agent-base:
    # s6-overlay's /init is PID 1 and does the reaping/signal work, so Docker's
    # own init would only add a second init in the chain.
    init: false
    stdin_open: true
    tty: true
    restart: "no"
    hostname: ${AGENT_HOSTNAME:-agent}

    environment:
      # The agent's working directory. Mount something over it (mounts.yml) to
      # work on real files; otherwise it is just a directory in the container.
      - AGENT_WORKSPACE=/home/${AGENT_USER:-agent}/Projects
      # Service toggles and restart budgets (see the image's README).
      - AGENT_DOCKERD=${AGENT_DOCKERD:-1}
      - AGENT_DOCKERD_TIMEOUT=${AGENT_DOCKERD_TIMEOUT:-30}
      - AGENT_DOCKERD_MAX_RESTARTS=${AGENT_DOCKERD_MAX_RESTARTS:-3}
      - AGENT_RESTART_MAX=${AGENT_RESTART_MAX:-3}

    volumes:
      # Images, containers and build cache of the in-container rootless daemon.
      # A named volume, not a bind mount: it holds files owned by subordinate
      # uids and losing it would discard the agent's image cache on every
      # recreate. Declare the volume in the composing file.
      - ${AGENT_DOCKER_VOLUME:-agent-docker}:/home/${AGENT_USER:-agent}/.local/share/docker
