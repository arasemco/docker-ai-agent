# =============================================================================
# compose/base.yml — the service skeleton every agent container shares
# =============================================================================
# One fragment, one concern. This one owns only the service's identity and the
# AGENT_* toggles; devices, proxy, limits, mounts and the build each live in
# their own file (see the others in this directory, or ../docker-compose.yml
# for the default combination).
#
# Loaded either by include (root docker-compose.yml) or by scripts/compose.sh
# (-f). Both rely on every fragment keying the same canonical service name.
# =============================================================================

services:
  agent-base:
    # s6-overlay's /init is PID 1 and does the reaping/signal work, so Docker's
    # own init would only add a second init in the chain.
    init: false
    stdin_open: true
    tty: true
    restart: "no"
    hostname: ${AGENT_HOSTNAME:-agent}

    environment:
      # Working directory. Mount something over it (mounts.yml) to work on real
      # files; otherwise it is just a directory in the container.
      - AGENT_WORKSPACE=/home/${AGENT_USER:-agent}/Projects
      # Service toggles and restart budgets (see the image's README).
      - AGENT_DOCKERD=${AGENT_DOCKERD:-1}
      - AGENT_DOCKERD_TIMEOUT=${AGENT_DOCKERD_TIMEOUT:-30}
      - AGENT_DOCKERD_MAX_RESTARTS=${AGENT_DOCKERD_MAX_RESTARTS:-3}
      - AGENT_RESTART_MAX=${AGENT_RESTART_MAX:-3}
