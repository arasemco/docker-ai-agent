# =============================================================================
# compose/limits.yml — CPU/memory limits, as an opt-in fragment
# =============================================================================
#   AGENT_CPUS=4 AGENT_MEMORY=8G docker compose --profile opencode up -d
#
# Defaults are modest on purpose: a shared base cannot assume the size of the
# machine it runs on. Set AGENT_CPUS / AGENT_MEMORY for the deployment.
# =============================================================================

services:
  agent-base:
    deploy:
      resources:
        limits:
          cpus: "${AGENT_CPUS:-2}"
          memory: "${AGENT_MEMORY:-4G}"
