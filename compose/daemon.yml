# =============================================================================
# compose/daemon.yml — everything the in-container rootless daemon needs
# =============================================================================
# One fragment, one concern: the hosts grants and the volume its data lives in.
# Skip it for a container that only needs the CLI side (AGENT_DOCKERD=0): the
# agent works fine without it, only `docker` inside the container is gone.
#
# Why each entry:
#   seccomp:unconfined / systempaths=unconfined
#       rootlesskit creates user and mount namespaces, which the default
#       seccomp profile and masked /proc paths block.
#   /dev/fuse         fuse-overlayfs, the storage driver that works on top of
#                     the container's own overlay root.
#   /dev/net/tun      slirp4netns, the daemon's user-mode networking.
#   the volume        images, containers and build cache. A named volume, not a
#                     bind mount: it holds files owned by subordinate uids, and
#                     losing it would throw away the image cache on every
#                     recreate. Declare it in the composing file.
# =============================================================================

services:
  agent-base:
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    devices:
      - /dev/fuse
      - /dev/net/tun
    volumes:
      - ${AGENT_DOCKER_VOLUME:-agent-docker}:/home/${AGENT_USER:-agent}/.local/share/docker

volumes:
  # Declared here because this fragment is what mounts it; compose only needs
  # it declared somewhere in the project. Set AGENT_DOCKER_VOLUME to a host
  # path to bind instead, and drop this declaration (or leave it: unused).
  agent-docker:
